# Server configuration
server:
  port: 8888

# Application metadata
info:
  app:
    environment: ${spring.profiles.active}
    name: ${spring.application.name}
    description: Centralised Config Server for the Streamix Application

# Spring application and infrastructure configuration
spring:
  application:
    name: config-server
  profiles:
    active: git
  config:
    import:
      - optional:file:./env.properties
  cloud:
    config:
      server:
        git:
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_PASSWORD}
          uri: ${GITHUB_REPO_URI}
          clone-on-start: true
          default-label: main   # branch name
      failFast: true
      retry:
        initial-interval: 3000
        multiplier: 1.3
        maxInterval: 10000
        maxAttempts: 20

# Service discovery properties
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: ${EUREKA_CLIENT_DEFAULT_ZONE}
  instance:
    prefer-ip-address: true

# Management and observability properties
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info, health, refresh

# Logging properties
logging:
  level:
    root: ERROR
    org.springframework: INFO
    com.mariuszilinskas: INFO
